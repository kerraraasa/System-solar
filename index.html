<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حاسبة حصن الأمان</title>
    <style>
        :root { --gold: #C9A84C; --navy: #0B1828; --navy-light: #1c3350; --cream: #F5EDD8; }
        
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: var(--navy); 
            color: var(--cream); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 10px;
        }

        .box { 
            background: var(--navy-light); 
            padding: 20px; 
            border-radius: 20px; 
            border: 1px solid var(--gold); 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        h2 { color: var(--gold); text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
        
        .inp-group { margin-bottom: 12px; }
        label { font-size: 0.8rem; color: #aaa; margin-bottom: 4px; display: block; }
        input { 
            width: 100%; padding: 12px; border: 1px solid #333; 
            background: #0b1828; color: white; border-radius: 8px; 
            box-sizing: border-box; font-size: 1rem;
        }

        button { 
            width: 100%; padding: 14px; background: linear-gradient(to right, #c9a84c, #e8c97a); 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; 
            color: var(--navy); margin-top: 15px; font-size: 1rem;
        }

        .res-box { 
            display: none; margin-top: 20px; background: #0b1828; 
            padding: 15px; border-radius: 12px; border-right: 4px solid var(--gold); 
        }
        
        .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .val { color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>حصن الأمان ⚡</h2>
    
    <div class="inp-group"><label>الأمبيرات المطلوبة</label><input type="number" id="a" placeholder="20"></div>
    <div class="inp-group"><label>ساعات التشغيل (تقديري)</label><input type="number" id="h" placeholder="8"></div>
    <div class="inp-group"><label>قدرة اللوح (W)</label><input type="number" id="p" placeholder="550"></div>
    <div class="inp-group"><label>سعة البطارية (Wh)</label><input type="number" id="b" placeholder="15000"></div>
    <div class="inp-group"><label>قدرة الإنفيرتر الواحد (W)</label><input type="number" id="i" placeholder="6000"></div>
    
    <button onclick="calc()">احسب النتائج الآن</button>

    <div id="res" class="res-box">
        <div class="row"><span>عدد البطاريات:</span><span class="val" id="rb"></span></div>
        <div class="row"><span>عدد الألواح:</span><span class="val" id="rp"></span></div>
        <div class="row"><span>عدد الإنفيرترات:</span><span class="val" id="ri"></span></div>
        <div class="row" style="border-top: 1px solid #333; margin-top: 10px; padding-top: 10px;">
            <span>ساعات التشغيل الفعلي:</span><span class="val" id="rh"></span>
        </div>
    </div>
</div>

<script>
    function calc() {
        const a = parseFloat(document.getElementById('a').value);
        const p = parseFloat(document.getElementById('p').value);
        const b = parseFloat(document.getElementById('b').value);
        const i = parseFloat(document.getElementById('i').value);
        
        // حساب القيم المطلوبة
        const instW = a * 220 * 1.4;
        const batt = Math.ceil((a * 220 * parseFloat(document.getElementById('h').value)) / (b * 0.72));
        const pan = Math.ceil((instW / p) + 2);
        const inv = Math.max(1, Math.ceil(instW / (i * 0.8)));

        // المعادلة الجديدة المطلوبة: ((عدد البطاريات × سعة البطارية × 0.72) ÷ 220) ÷ الأمبيرات
        const realHours = ((batt * b * 0.72) / 220) / a;

        document.getElementById('rb').innerText = batt + " بطارية";
        document.getElementById('rp').innerText = pan + " لوح";
        document.getElementById('ri').innerText = inv + " إنفيرتر";
        document.getElementById('rh').innerText = realHours.toFixed(1) + " ساعة";
        document.getElementById('res').style.display = 'block';
    }
</script>
</body>
</html>
